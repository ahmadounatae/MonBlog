name: Docker PHP CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  IMAGE_NAME: monblog

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME .

  php-lint:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME .

      - name: PHP lint index.php
        run: |
          docker run --rm $IMAGE_NAME php -l index.php

      - name: PHP lint all PHP files
        run: |
          docker run --rm $IMAGE_NAME sh -c "find php -name '*.php' -exec php -l {} \;"
